<!DOCTYPE html>
<!-- このページでは日記とコメントを表示する。 -->
<html>

<head>

    <meta charset="UTF-8">
    <title>20260928</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://wqhcznhalhpsxchkdauz.supabase.co" crossorigin>
    <link rel="icon" type="image/png" href="images/site-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <!-- 前回のコメント欄の高さを先に戻し、読み込み中に画面がずれるのを防ぐ。 -->
    <script>
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }
        (function () {
            const layoutHeight = sessionStorage.getItem(
                "message-layout-reserved-height"
            );
            if (layoutHeight !== null) {
                document.documentElement.classList.add(
                    "message-layout-size-reserved"
                );
                document.documentElement.style.setProperty(
                    "--message-layout-reserved-height",
                    layoutHeight
                );
            }
        })();
    </script>
    <!-- ページ全体と日記・コメント欄の見た目を設定するファイル。 -->
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main id="diary-section">
        <!-- 選択中の日記を表示する場所。 -->
        <section id="diary-view" aria-label="選択中の日記">
            <!-- 前後の日記へ移動するボタン。日記を読み込むまでは表示しない。 -->
            <nav class="diary-entry-navigation" aria-label="日記の移動" hidden>
                <button type="button" data-diary-direction="previous">◂</button>
                <button type="button" data-diary-direction="next">▸</button>
                <button id="diary-add" type="button" hidden>追加</button>
            </nav>
            <!-- 選んだ日記の内容を表示する場所。 -->
            <div id="diary-list"></div>
        </section>
    </main>

    <!-- 日記の下にコメントの入力欄、コメント一覧、古いコメントのまとまりを表示する。 -->
    <section id="message-section" aria-label="コメント">
        <div id="message-layout">
            <div id="message-form">
                <textarea id="message" rows="4" aria-label="コメント"></textarea>
                <div id="message-actions">
                    <div id="message-submit-controls">
                        <button id="send" type="button">送信</button>
                    </div>
                </div>
            </div>
            <div id="chat" aria-label="コメント一覧"></div>
            <div id="chat-older-messages" class="chat-older-messages" aria-label="過去のコメント"></div>
        </div>
    </section>

    <!-- 読み込む順番。接続に使うライブラリーと設定を先に読み、その後に日記とコメントの処理を読み込む。 -->
    <script>
        window.markPageSectionReady = function (section) {
            document.body.classList.add(section + "-ready");
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="supabase.js"></script>
    <script defer src="diary.js"></script>
    <script defer src="comment.js"></script>
</body>

</html>
